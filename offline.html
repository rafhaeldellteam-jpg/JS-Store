<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("jss_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161012" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JS STORE">
<meta name="format-detection" content="telephone=no">
<title>Sem conexão · JS STORE</title>
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<main style="min-height:100dvh;display:grid;place-items:center;text-align:center;padding:24px">
  <div>
    <img class="theme-img" data-light="/assets/img/butterfly.webp" data-dark="/assets/img/butterfly-dark.webp" alt="" style="width:140px;margin:0 auto 14px;animation:float 6s ease-in-out infinite">
    <h1 style="font-family:var(--display);font-weight:500;font-size:40px;margin:0">Você está sem internet</h1>
    <p class="muted" style="max-width:340px;margin:10px auto 22px">Assim que a conexão voltar, a vitrine da JS STORE aparece de novo.</p>
    <button class="btn btn-gold" onclick="location.reload()">Tentar de novo</button>
  </div>
</main>
<script>addEventListener("online",()=>location.reload())</script>
<script>(function(){var d=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.querySelectorAll("img[data-light]").forEach(function(i){i.src=d==="dark"?i.dataset.dark:i.dataset.light})})()</script>
</body>
</html>
