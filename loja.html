<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loja · JS STORE</title>
<meta name="description" content="Todas as peças da JS STORE: vestidos, blusas, calças, saias, conjuntos e mais.">
<meta name="theme-color" content="#fff8f7">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<meta property="og:image" content="/assets/img/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <div class="shop-head">
    <span class="eyebrow" id="shop-eyebrow">Coleção</span>
    <h1 id="shop-title">Toda a loja</h1>
    <p class="muted" id="shop-sub">Encontre a peça perfeita pra você.</p>
  </div>
  <div class="cats" id="cats" style="margin-bottom:20px"></div>
  <div class="toolbar">
    <div class="left">
      <select class="pill-select" id="f-sort" aria-label="Ordenar">
        <option value="new">Mais recentes</option>
        <option value="hot">Mais vendidas</option>
        <option value="low">Menor preço</option>
        <option value="high">Maior preço</option>
      </select>
      <select class="pill-select" id="f-show" aria-label="Mostrar">
        <option value="">Todas</option>
        <option value="novidades">Novidades</option>
        <option value="promo">Em promoção</option>
        <option value="destaque">Mais amadas</option>
      </select>
      <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="f-stock" checked> Só disponíveis</label>
    </div>
    <span class="count" id="count"></span>
  </div>
  <div class="size-filter" id="f-sizes" style="margin-bottom:26px"></div>
  <div class="grid" id="grid"></div>
</main>
<div id="site-footer"></div>
<script type="module" src="/assets/js/loja.js"></script>
</body>
</html>
